# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      skip_acceptance_tests:
        description: 'Skip acceptance tests (useful when BCM endpoint is unavailable)'
        required: false
        default: 'false'
        type: boolean

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need Terraform 1.14+ for actions documentation generation
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: '1.14.2'
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code -- ':!.claude/' || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Run unit tests (no BCM connection required)
  unit-test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - name: Run unit tests
        run: go test -v -cover -timeout=120s ./internal/provider/ -run "^TestUnit"

  # Run acceptance tests in a matrix with Terraform CLI versions
  # These tests require BCM endpoint connectivity
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip if manual trigger with skip_acceptance_tests=true
    if: github.event.inputs.skip_acceptance_tests != 'true'
    strategy:
      fail-fast: false
      matrix:
        # Terraform versions to test against
        terraform:
          - '1.5.*'
          - '1.6.*'
          - '1.7.*'
          - '1.8.*'
          - '1.9.*'
          - '1.10.*'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: Check BCM credentials
        id: check-creds
        env:
          BCM_ENDPOINT: ${{ secrets.BCM_ENDPOINT }}
        run: |
          if [ -z "$BCM_ENDPOINT" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BCM credentials not configured - acceptance tests will be skipped"
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run acceptance tests
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          TF_ACC: "1"
          BCM_ENDPOINT: ${{ secrets.BCM_ENDPOINT }}
          BCM_USERNAME: ${{ secrets.BCM_USERNAME }}
          BCM_PASSWORD: ${{ secrets.BCM_PASSWORD }}
        run: go test -v -cover -timeout 120m ./internal/provider/
