# Pre-commit hooks for Terraform code quality
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate
repos:
  # Terraform formatting and validation

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys

  # Pre-push hooks: catch build, lint, and doc generation issues before pushing
  - repo: local
    hooks:
      - id: go-build
        name: Go build
        entry: go build ./...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: go-generate-check
        name: Check generated docs are up to date
        entry: bash -c 'make install && make generate && git diff --exit-code -- docs/ || (echo "docs/ out of date — run make install && make generate and commit"; exit 1)'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

